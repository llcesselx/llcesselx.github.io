<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Phasmo Stream Overlay</title>
  <style>
    :root {
      --bg: rgba(15, 15, 15, 0.9);
      --accent: #ff4444;
      --text: #ffffff;
      --panel-bg: #222;
    }
    body { font-family: 'Courier New', Courier, monospace; color: var(--text); background: transparent; margin: 0; width: 380px; overflow: hidden; }
    .container { background: var(--bg); padding: 15px; border: 2px solid #444; border-radius: 10px; animation: flicker 5s infinite; }

    /* Sanity Section */
    .section { background: var(--panel-bg); padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #333; }
    .header { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px solid #444; }
    .sanity-val { font-size: 2rem; font-weight: bold; color: var(--accent); text-align: center; }
    .row { display: flex; gap: 5px; margin-bottom: 5px; }
    select, button { background: #333; color: white; border: 1px solid #555; padding: 5px; flex: 1; cursor: pointer; }

    /* Evidence Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .ev-btn { font-size: 0.75rem; text-align: left; transition: 0.2s; }
    .ev-btn.found { background: #2ecc71; border-color: #27ae60; }
    .ev-btn.ruled { background: #e74c3c; opacity: 0.4; text-decoration: line-through; }

    /* Speed Tapper */
    #speed-display { font-size: 1.2rem; text-align: center; color: #f1c40f; margin-top: 5px; }

    /* Ghost List */
    .ghost-list { display: flex; flex-wrap: wrap; gap: 4px; font-size: 0.7rem; }
    .ghost { background: #333; padding: 2px 6px; border-radius: 2px; transition: 0.3s; }
    .ghost.impossible { opacity: 0.1; order: 2; transform: scale(0.8); }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.9; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="section">
    <div class="header">Est. Team Sanity</div>
    <div class="sanity-val" id="sanity-display">100%</div>
    <div class="row">
      <select id="map-size">
        <option value="0.12">Small Map</option>
        <option value="0.08">Medium Map</option>
        <option value="0.05">Large Map</option>
      </select>
      <select id="difficulty">
        <option value="1">Amateur (1x)</option>
        <option value="1.5">Inter. (1.5x)</option>
        <option value="2">Pro/Insane (2x)</option>
      </select>
    </div>
    <button onclick="toggleSanity()" id="sanity-toggle">Start Investigation</button>
  </div>

  <div class="section">
    <div class="header">Evidence</div>
    <div class="grid" id="evidence-grid"></div>
  </div>

  <div class="section">
    <div class="header">Footstep Speed (Tap to Time)</div>
    <button id="tap-btn" style="height: 40px; font-weight: bold; background: #444;">TAP ALONG TO FEET</button>
    <div id="speed-display">--- m/s</div>
  </div>

  <div class="section">
    <div class="header">Possible Matches</div>
    <div class="ghost-list" id="ghost-list"></div>
  </div>

  <button onclick="resetAll()" style="width:100%; margin-top:10px; color:#888;">HARD RESET</button>
</div>

<script>
  // --- DATA ---
  const evidenceTypes = ["EMF 5", "Spirit Box", "Ultraviolet", "Ghost Writing", "Freezing", "Ghost Orb", "DOTS"];
  const ghosts = [
    { name: "Dayan", ev: ["EMF 5", "Ghost Orb", "Spirit Box"], speed: "2.25" },
    { name: "Deogen", ev: ["Spirit Box", "Ghost Writing", "DOTS"], speed: "Variable" },
    { name: "Moroi", ev: ["Spirit Box", "Ghost Writing", "Freezing"], speed: "Fast" },
    { name: "Revenant", ev: ["Ghost Writing", "Freezing", "Ghost Orb"], speed: "Very Fast" },
    { name: "Thaye", ev: ["Ghost Orb", "Ghost Writing", "DOTS"], speed: "Aggressive" },
    { name: "Obambo", ev: ["Ghost Writing", "Ultraviolet", "DOTS"], speed: "1.95" },
    { name: "Gallu", ev: ["Ultraviolet", "Ghost Writing", "Freezing"], speed: "Variable" }
    // ... (Add standard ghosts here as needed)
  ];

  // --- STATE ---
  let state = { sanity: 100, isRunning: false, evidence: {} };
  evidenceTypes.forEach(e => state.evidence[e] = 0);
  let lastTap = 0;
  let tapDiffs = [];

  // --- SANITY LOGIC ---
  function updateSanity() {
    if (!state.isRunning) return;
    const rate = parseFloat(document.getElementById('map-size').value);
    const mult = parseFloat(document.getElementById('difficulty').value);
    state.sanity -= (rate * mult) / 10; // Simple drain logic
    if (state.sanity < 0) state.sanity = 0;
    document.getElementById('sanity-display').innerText = Math.floor(state.sanity) + "%";
    setTimeout(updateSanity, 1000);
  }

  function toggleSanity() {
    state.isRunning = !state.isRunning;
    document.getElementById('sanity-toggle').innerText = state.isRunning ? "Pause Timer" : "Resume Timer";
    if (state.isRunning) updateSanity();
  }

  // --- SPEED TAPPER LOGIC ---
  document.getElementById('tap-btn').addEventListener('mousedown', (e) => {
    const now = Date.now();
    if (lastTap > 0) {
      const diff = now - lastTap;
      if (diff < 2000) { // Only count taps within 2 seconds
        tapDiffs.push(diff);
        if (tapDiffs.length > 5) tapDiffs.shift();
        const avg = tapDiffs.reduce((a, b) => a + b) / tapDiffs.length;
        const mps = (1.7 * (500 / avg)).toFixed(2); // Normalized to standard 1.7m/s ghost
        document.getElementById('speed-display').innerText = mps + " m/s";
      }
    }
    lastTap = now;
  });

  // --- RENDER ---
  function render() {
    const grid = document.getElementById('evidence-grid');
    grid.innerHTML = '';
    evidenceTypes.forEach(e => {
      const btn = document.createElement('button');
      btn.className = `ev-btn ${state.evidence[e] === 1 ? 'found' : state.evidence[e] === 2 ? 'ruled' : ''}`;
      btn.innerText = e;
      btn.onclick = () => { state.evidence[e] = (state.evidence[e] + 1) % 3; render(); };
      grid.appendChild(btn);
    });

    const list = document.getElementById('ghost-list');
    list.innerHTML = '';
    ghosts.forEach(g => {
      const span = document.createElement('span');
      span.className = 'ghost';
      let fail = false;
      for (const [ev, val] of Object.entries(state.evidence)) {
        if (val === 1 && !g.ev.includes(ev)) fail = true;
        if (val === 2 && g.ev.includes(ev)) fail = true;
      }
      if (fail) span.classList.add('impossible');
      span.innerText = g.name;
      list.appendChild(span);
    });
  }

  function resetAll() {
    state.sanity = 100;
    state.isRunning = false;
    evidenceTypes.forEach(e => state.evidence[e] = 0);
    document.getElementById('sanity-display').innerText = "100%";
    document.getElementById('speed-display').innerText = "--- m/s";
    render();
  }

  render();
</script>

</body>
</html>
