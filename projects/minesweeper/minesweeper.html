<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="minesweeper.css"/>
    <title>Minesweeper Modern</title>
</head>
<body>
<div class="game-header">
    <h1>Minesweeper</h1>
    <div class="controls">
        <button class="back-btn" onclick="goHome()">Back</button>
        <div class="input-group">
            <label for="mineCount">Mines:</label>
            <input type="number" id="mineCount" value="10" min="1" max="40">
            <button onclick="startGame()">New Game</button>
        </div>
    </div>
</div>

<div id="game-grid" class="grid-container"></div>

<script src="/llcesselx.js"></script> <script src="minesweeper.js"></script>
</body>
</html>
