<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOD: Chad</title>
  <link rel="stylesheet" href="wods.css"/>
  <link rel="icon" href="images/crossfitlogo.png"/>
</head>
<body onload="getchadscore()">
<nav class="nav-header">
  <button class="back-btn" onclick="back()">← Back</button>
</nav>

<main class="workout-container">
  <header class="wod-header">
    <h1>Chad</h1>
    <p class="workout-type">In Honor of Navy SEAL Chad Wilkinson</p>
  </header>

  <section class="interval-card">
    <div class="interval-header">For Time</div>

    <div class="interval-grid">
      <div class="work-row tier-1">
        <span class="movement">1,000 Weighted Step-Ups</span>
        <span class="timer">45lb Ruck / 20" Box</span>
      </div>
    </div>
  </section>

  <section class="counter-section">
    <div class="counter-display"><span id="repDisplay">0</span> / 1000</div>
    <p style="font-size: 0.8rem; color: #bebebe;">Keep moving. One step at a time.</p>
    <div style="display: flex; gap: 10px;">
      <button class="count-btn" onclick="addReps(50)">+ 50</button>
      <button class="count-btn" onclick="addReps(100)">+ 100</button>
    </div>
    <button class="reset-btn" onclick="resetReps()">Reset Counter</button>
  </section>

  <section class="score-section">
    <h3>Final Time</h3>
    <div class="score-inputs">
      <input type="text" id="userInput" placeholder="MM:SS">
      <button class="save-btn" onclick="setchadscore()">Save Result</button>
    </div>
    <div id="savedScore" class="previous-score"></div>
  </section>

  <div class="image-container">
    <img class="workout-img" src="images/chad.jpg" alt="Chad WOD Memorial"/>
  </div>
</main>

<script src="wods.js"></script>
<script>
  let totalReps = 0;

  function addReps(val) {
    totalReps += val;
    if(totalReps > 1000) totalReps = 1000;
    document.getElementById('repDisplay').innerText = totalReps;

    if(totalReps === 1000) {
      alert("1,000 Reps Done! Stop the clock.");
    }
  }

  function resetReps() {
    totalReps = 0;
    document.getElementById('repDisplay').innerText = totalReps;
  }

  function back() {
    window.location.href = "fitness.html";
  }

  function setchadscore() {
    const score = document.getElementById('userInput').value;
    localStorage.setItem("chadScore", score);
    getchadscore();
  }

  function getchadscore() {
    const saved = localStorage.getItem("chadScore");
    if (saved) {
      document.getElementById('savedScore').innerText = "Personal Best: " + saved;
    }
  }
</script>
</body>
</html>
