<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOD: Recovery Day</title>
    <link rel="stylesheet" href="wods.css"/>
    <link rel="icon" href="images/crossfitlogo.png"/>
</head>
<body onload="getrecoveryscore()">
<nav class="nav-header">
    <button class="back-btn" onclick="goBack()">← Back</button>
</nav>

<main class="workout-container">
    <header class="wod-header">
        <h1>Recovery Day</h1>
        <p class="workout-type">3 Rounds for Total Calories (34 Minutes Total)</p>
    </header>

    <section class="interval-card">
        <div class="interval-header">Rotation (Repeat 3x)</div>

        <div class="interval-grid">
            <div class="work-row tier-1">
                <span class="movement">Air Bike</span>
                <span class="timer">2 Minutes</span>
            </div>
            <div class="rest-row">2 MINUTE REST</div>

            <div class="work-row tier-2">
                <span class="movement">Row</span>
                <span class="timer">2 Minutes</span>
            </div>
            <div class="rest-row">2 MINUTE REST</div>

            <div class="work-row tier-3">
                <span class="movement">SkiErg</span>
                <span class="timer">2 Minutes</span>
            </div>
            <div class="rest-row">2 MINUTE REST</div>
        </div>
    </section>

    <section class="counter-section">
        <div class="counter-display">Round: <span id="roundDisplay">0</span> / 3</div>
        <button class="count-btn" onclick="incrementRound()">+ COMPLETE ROTATION</button>
        <button class="reset-btn" onclick="resetCounter()">Reset</button>
    </section>

    <section class="score-section">
        <h3>Log Aerobic Output</h3>
        <div class="score-inputs">
            <input type="number" id="userInput" placeholder="Total Calories">
            <button class="save-btn" onclick="setrecoveryscore()">Save Result</button>
        </div>
        <div id="savedScore" class="previous-score"></div>
    </section>
</main>

<script src="wods.js"></script>
<script>
    let currentRounds = 0;

    function incrementRound() {
        if (currentRounds < 3) {
            currentRounds++;
            document.getElementById('roundDisplay').innerText = currentRounds;
        }
    }

    function resetCounter() {
        currentRounds = 0;
        document.getElementById('roundDisplay').innerText = currentRounds;
    }

    function goBack() {
        window.location.href = "../fitness.html";
    }

    function setrecoveryscore() {
        const score = document.getElementById('userInput').value;
        localStorage.setItem("recoveryScore", score);
        getrecoveryscore();
    }

    function getrecoveryscore() {
        const saved = localStorage.getItem("recoveryScore");
        if (saved) {
            document.getElementById('savedScore').innerText = "Last Session: " + saved + " Cals";
        }
    }
</script>
</body>
</html>
