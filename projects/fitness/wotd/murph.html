<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOD: Murph</title>
  <link rel="stylesheet" href="wods.css"/>
  <link rel="icon" href="images/crossfitlogo.png"/>
</head>
<body onload="getmurphscore()">
<nav class="nav-header">
  <button class="back-btn" onclick="back()">← Back</button>
</nav>

<main class="workout-container">
  <header class="wod-header">
    <h1>Murph</h1>
    <p class="workout-type">In Honor of LT. Michael P. Murphy (USN)</p>
  </header>

  <section class="interval-card">
    <div class="interval-header">For Time (with 20lb/14lb Vest)</div>

    <div class="interval-grid">
      <div class="work-row tier-1">
        <span class="movement">1 Mile Run</span>
      </div>
      <div class="work-row tier-2">
        <span class="movement">100 Pull-Ups</span>
      </div>
      <div class="work-row tier-2">
        <span class="movement">200 Push-Ups</span>
      </div>
      <div class="work-row tier-2">
        <span class="movement">300 Air Squats</span>
      </div>
      <div class="work-row tier-3">
        <span class="movement">1 Mile Run</span>
      </div>
    </div>
  </section>

  <section class="counter-section">
    <div class="counter-display">Reps: <span id="repDisplay">0</span></div>
    <p style="font-size: 0.8rem; color: #bebebe;">Tap to track your progress through the 600 total reps</p>
    <button class="count-btn" onclick="addReps(5)">+ 5 REPS</button>
    <button class="count-btn" style="background: #008991; margin-top: 5px;" onclick="addReps(20)">+ 20 REPS</button>
    <button class="reset-btn" onclick="resetReps()">Reset Counter</button>
  </section>

  <section class="score-section">
    <h3>Final Time</h3>
    <div class="score-inputs">
      <input type="text" id="userInput" placeholder="MM:SS">
      <button class="save-btn" onclick="setmurphscore()">Save Result</button>
    </div>
    <div id="savedScore" class="previous-score"></div>
  </section>

  <div class="image-container">
    <img class="workout-img" src="images/murph.jpg" alt="Murph workout tribute"/>
  </div>
</main>

<script src="wods.js"></script>
<script>
  let totalReps = 0;

  function addReps(val) {
    totalReps += val;
    if(totalReps > 600) totalReps = 600;
    document.getElementById('repDisplay').innerText = totalReps;
  }

  function resetReps() {
    totalReps = 0;
    document.getElementById('repDisplay').innerText = totalReps;
  }

  function back() {
    window.location.href = "fitness.html";
  }

  function setmurphscore() {
    const score = document.getElementById('userInput').value;
    localStorage.setItem("murphScore", score);
    getmurphscore();
  }

  function getmurphscore() {
    const saved = localStorage.getItem("murphScore");
    if (saved) {
      document.getElementById('savedScore').innerText = "Personal Best: " + saved;
    }
  }
</script>
</body>
</html>
