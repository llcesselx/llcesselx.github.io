<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOD: The Seven</title>
  <link rel="stylesheet" href="wods.css"/>
  <link rel="icon" href="images/crossfitlogo.png"/>
</head>
<body onload="getsevenscore()">
<nav class="nav-header">
  <button class="back-btn" onclick="back()">← Back</button>
</nav>

<main class="workout-container">
  <header class="wod-header">
    <h1>The Seven</h1>
    <p class="workout-type">In Honor of the CIA Officers killed in Afghanistan</p>
  </header>

  <section class="interval-card">
    <div class="interval-header">7 Rounds For Time</div>

    <div class="interval-grid">
      <div class="work-row tier-1">
        <span class="movement">7 Handstand Push-Ups</span>
      </div>
      <div class="work-row tier-1">
        <span class="movement">7 Thrusters</span>
        <span class="timer">135/95 lb</span>
      </div>
      <div class="work-row tier-2">
        <span class="movement">7 Knees-to-Elbows</span>
      </div>
      <div class="work-row tier-2">
        <span class="movement">7 Deadlifts</span>
        <span class="timer">245/165 lb</span>
      </div>
      <div class="work-row tier-2">
        <span class="movement">7 Burpees</span>
      </div>
      <div class="work-row tier-3">
        <span class="movement">7 KB Swings</span>
        <span class="timer">2 / 1.5 pood</span>
      </div>
      <div class="work-row tier-3">
        <span class="movement">7 Pull-Ups</span>
      </div>
    </div>
  </section>

  <section class="counter-section">
    <div class="counter-display">Round: <span id="roundDisplay">0</span> / 7</div>
    <p style="font-size: 0.8rem; color: #bebebe;">"A suicide mission for the body." - Keep Pushing.</p>
    <button class="count-btn" id="roundBtn" onclick="nextRound()">COMPLETE ROUND</button>
    <button class="reset-btn" onclick="resetSeven()">Reset Tracker</button>
  </section>

  <section class="score-section">
    <h3>Final Time</h3>
    <div class="score-inputs">
      <input type="text" id="userInput" placeholder="MM:SS">
      <button class="save-btn" onclick="setsevenscore()">Save Result</button>
    </div>
    <div id="savedScore" class="previous-score"></div>
  </section>

  <div class="image-container">
    <img class="workout-img" src="images/seven.jpg" alt="The Seven Hero WOD Memorial"/>
  </div>
</main>

<script src="wods.js"></script>
<script>
  let currentRound = 0;

  function nextRound() {
    if (currentRound < 7) {
      currentRound++;
      document.getElementById('roundDisplay').innerText = currentRound;

      if(currentRound === 7) {
        document.getElementById('roundBtn').innerText = "WORKOUT COMPLETE";
        document.getElementById('roundBtn').style.background = "#27ae60";
        alert("Time! Great work.");
      }
    }
  }

  function resetSeven() {
    currentRound = 0;
    document.getElementById('roundDisplay').innerText = "0";
    document.getElementById('roundBtn').innerText = "COMPLETE ROUND";
    document.getElementById('roundBtn').style.background = "#00adb5";
  }

  function back() {
    window.location.href = "fitness.html";
  }

  function setsevenscore() {
    const score = document.getElementById('userInput').value;
    localStorage.setItem("sevenScore", score);
    getsevenscore();
  }

  function getsevenscore() {
    const saved = localStorage.getItem("sevenScore");
    if (saved) {
      document.getElementById('savedScore').innerText = "Personal Best: " + saved;
    }
  }
</script>
</body>
</html>
