<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ISU Rover | Hardware Viewer</title>
    <link rel="stylesheet" href="rover-style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

<nav class="nav-header">
    <button class="btn-isu" onclick="window.location.href='index.html'">← BACK TO PORTFOLIO</button>
</nav>

<div class="container">
    <h1>ROVER DESIGN INSPECTION</h1>

    <div class="gallery-card">
        <model-viewer
                src="assets/MainBody.glb"
                camera-controls
                auto-rotate
                style="width: 100%; height: 500px; background-color: #000;">
        </model-viewer>
    </div>

    <div class="info-panel">
        <h3>System Status: Online</h3>
        <p>If the model is not appearing, please ensure <strong>assets/rover_full.glb</strong> exists in your GitHub repository with this exact capitalization.</p>
    </div>
</div>

</body>
</html>
