<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ISU Rover | Hardware Viewer</title>
    <link rel="stylesheet" href="rover-style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

<nav class="nav-header">
    <button class="btn-isu" onclick="goBack()">← BACK TO PORTFOLIO</button>
</nav>

<div class="container">
    <h1>ROVER CUSTOM 3D MODELS</h1>

    <div class="gallery-card">
        <model-viewer
                src="cad/Rover.glb"
                camera-controls
                auto-rotate
                shadow-intensity="1"
                bounds="tight"
                style="width: 100%; height: 500px; background-color: #222;">
        </model-viewer>
    </div>

    <div class="info-panel">
        <h3>Complete Rover</h3>
        <p>Complete model of the Yuumi autonomous rescue rover with all components assembled.</p>
    </div>
</div>

</body>
</html>
